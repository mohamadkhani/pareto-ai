<input
  class="control"
  [attr.id]="controlId()"
  [type]="type()"
  [value]="value()"
  [attr.placeholder]="placeholder() || null"
  [attr.name]="name() || null"
  [attr.autocomplete]="autocomplete() || null"
  [attr.inputmode]="inputmode() || null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [disabled]="disabled()"
  [readonly]="readonly()"
  (input)="onInput($event)"
/>

<textarea
  class="control"
  [attr.id]="controlId()"
  [value]="value()"
  [rows]="rows()"
  [attr.placeholder]="placeholder() || null"
  [attr.name]="name() || null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [disabled]="disabled()"
  [readonly]="readonly()"
  (input)="onInput($event)"
></textarea>

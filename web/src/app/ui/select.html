<select
  #selectEl
  class="control select"
  [attr.id]="controlId()"
  [value]="value()"
  [attr.name]="name() || null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [disabled]="isDisabled()"
  (change)="onChangeEvent($event)"
  (blur)="onBlur()"
>
  <ng-content />
</select>

<div class="field">
  @if (label()) {
    <label [attr.for]="id()">
      {{ label() }}
      @if (optional()) {
        <span class="optional">optional</span>
      }
    </label>
  }
  <ng-content />
  @if (hint() && !invalid()) {
    <p class="hint" [attr.id]="hintId()">{{ hint() }}</p>
  }
  @if (invalid()) {
    <p class="error" [attr.id]="errorId()" role="alert">{{ error() }}</p>
  }
</div>

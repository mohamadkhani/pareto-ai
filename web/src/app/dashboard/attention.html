<div class="attention" [class.is-danger]="attention().tone === 'danger'" role="status">
  <svg
    class="attention-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >
    <path d="M12 3 2 21h20L12 3z" />
    <path d="M12 9v5M12 17h.01" />
  </svg>
  <p><strong>Needs attention</strong> · {{ attention().parts.join(' · ') }}</p>
  <div class="attention-links">
    @for (link of attention().links; track link.path) {
      <a [routerLink]="link.path">{{ link.label }}</a>
    }
  </div>
</div>

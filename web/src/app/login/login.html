<div class="login-wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Pareto Gateway</h1>
    <p class="subtitle">Sign in with your gateway account.</p>

    @if (errorMessage()) {
      <div class="banner" role="alert">{{ errorMessage() }}</div>
    }

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      placeholder="you@example.com"
    />
    @if (showError('email')) {
      <p class="field-error" role="alert">{{ fieldError('email') }}</p>
    }

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (showError('password')) {
      <p class="field-error" role="alert">{{ fieldError('password') }}</p>
    }

    <button type="submit" class="btn primary" [disabled]="pending()">
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>

<div class="auth-page">
  <form class="auth-card" (submit)="submit($event)" novalidate>
    <div class="auth-card__head">
      <h1 class="auth-card__title">Pareto Gateway</h1>
      <p class="auth-card__subtitle">Sign in with your gateway account.</p>
    </div>

    @if (errorMessage(); as message) {
      <ui-banner tone="danger">{{ message }}</ui-banner>
    }

    <ui-field controlId="login-email" label="Email" [error]="emailError()">
      <ui-input
        type="email"
        autocomplete="username"
        placeholder="you@example.com"
        [(value)]="email"
        [disabled]="pending()"
      />
    </ui-field>

    <ui-field controlId="login-password" label="Password" [error]="passwordError()">
      <ui-input
        type="password"
        autocomplete="current-password"
        [(value)]="password"
        [disabled]="pending()"
      />
    </ui-field>

    <div class="auth-card__actions">
      <ui-button type="submit" variant="primary" [loading]="pending()">Sign in</ui-button>
    </div>
  </form>
</div>

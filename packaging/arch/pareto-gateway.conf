# Pareto AI gateway configuration, read by pareto-gateway.service.
# Every variable is optional and overrides the unit's default; restart after
# editing:  systemctl restart pareto-gateway
#
# Where to listen. Reachable only from this machine by default; use an SSH
# tunnel or a reverse proxy for remote access.
# GATEWAY_LISTEN=127.0.0.1:8081
#
# State directory (gateway.db, master.key, logs).
# GATEWAY_DATA_DIR=/var/lib/pareto-gateway
#
# 1 = allow session cookies over plain HTTP (required on 127.0.0.1 without
# TLS). Set 0 when TLS terminates in front of the gateway.
# GATEWAY_INSECURE_COOKIES=1
#
# Pre-create the admin instead of running the first-run setup wizard.
# GATEWAY_ADMIN_EMAIL=admin@example.com
# GATEWAY_ADMIN_PASSWORD=change-me

# Continuous integration for the gateway and the console.
#
# The same gate as `just check`, split so the toolchains do not wait on each
# other and the server binaries stay downloadable on every run:
#
#   just fmt-check  -> cargo fmt --check
#   just lint       -> cargo clippy --all-targets -- -D warnings
#   just test       -> cargo test
#   just build-api  -> cargo build --release --no-default-features
#   just ui-check   -> pnpm build + pnpm test + prettier --check
#
# The web work is split in two on purpose: `web` builds the console and uploads
# `web/dist`, `web-check` runs the UI tests and the formatting check. `rust` and
# `gateway` only wait for the build, so a failing UI test never blocks the
# downloadable server binaries.
#
# Two differences from the Justfile:
#
# - no `--offline`: the Justfile relies on a warm local cargo cache, a fresh
#   runner has none;
# - the Rust jobs get `web/dist` from the web job as an artifact instead of
#   rebuilding Angular, because the server embeds it at compile time
#   (`rust-embed`).
#
# The `gateway` job packages the two server binaries (embedded UI and api-only)
# for Linux and Windows and uploads them as run artifacts on every run. It
# reuses the web job's `web-dist` artifact instead of rebuilding Angular, and
# falls back to a local `pnpm run build` only when the artifact is unavailable
# (for example a re-run of a single job). On a `v*` tag the release job attaches
# the artifacts to the GitHub Release — only when web-check, rust and gateway
# are all green — and `publish-aur` updates the server AUR packages with the
# AUR_SSH_PRIVATE_KEY secret (desktop packages are published by desktop.yml).
#
# No secrets are required. Desktop packaging lives in desktop.yml.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Builds the Angular console and publishes web/dist for the Rust jobs. The UI
  # tests live in `web-check` so they cannot block the server binaries.
  web:
    name: Web (build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Output lands in web/dist/web/browser and is consumed by the Rust jobs.
      - name: Build
        working-directory: web
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          if-no-files-found: error
          path: web/dist/web/browser
          retention-days: 1

  # The UI half of the gate: unit tests and formatting. Independent of the
  # build job, so a failing test still leaves web/dist and the gateway binaries
  # downloadable from the run.
  web-check:
    name: Web (tests, formatting)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Check formatting
        working-directory: web
        run: pnpm exec prettier --check src/

  rust:
    name: Rust (format, clippy, tests, api-only build)
    needs: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # The embedded-UI feature compiles web/dist into the binary; restores it
      # instead of paying for a second Angular build.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser

      - name: Check formatting
        working-directory: server
        run: cargo fmt --check

      - name: Clippy
        working-directory: server
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: server
        run: cargo test --locked

      - name: API-only release build
        working-directory: server
        run: cargo build --locked --release --no-default-features

  # Builds the shippable server binaries for each platform. Nothing is
  # cross-compiled: the Windows binary comes from windows-latest, the same
  # proven step as the desktop sidecar in desktop.yml.
  gateway:
    name: Gateway binary (${{ matrix.name }})
    # Only the web *build*, never the UI tests: the server binaries must stay
    # downloadable from the run even when web-check is red.
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # Same flow as the rust job: `build.rs` needs
      # web/dist/web/browser/index.html at compile time for the embedded UI.
      - name: Restore web/dist from the web job
        id: web-dist
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser

      # Fallback only: a re-run of this job alone has no artifact to download.
      - name: Set up pnpm (fallback)
        if: steps.web-dist.outcome != 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Set up Node (fallback)
        if: steps.web-dist.outcome != 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web console (fallback)
        if: steps.web-dist.outcome != 'success'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Check the embedded UI input exists
        shell: bash
        run: test -f web/dist/web/browser/index.html

      - name: Read the version from server/Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="$(sed -n '1,10s/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n1)"
          if [ -z "$raw" ]; then
            echo "could not read the package version from server/Cargo.toml" >&2
            exit 1
          fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      # Both feature sets write `target/<triple>/release/gateway[.exe]`, so each
      # binary is copied to dist/bin before the next build can overwrite it.
      - name: Build the gateway with the embedded UI
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"
          mkdir -p ../dist/bin
          cp "target/${{ matrix.target }}/release/gateway${{ matrix.ext }}" \
             "../dist/bin/pareto-gateway${{ matrix.ext }}"

      - name: Build the api-only gateway
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --no-default-features \
            --target "${{ matrix.target }}"
          mkdir -p ../dist/bin
          cp "target/${{ matrix.target }}/release/gateway${{ matrix.ext }}" \
             "../dist/bin/pareto-gateway-api${{ matrix.ext }}"

      # Layout inside the archive: the two binaries plus LICENSE, README.md and
      # the systemd daemon files (also consumed by the AUR pareto-ai-bin
      # PKGBUILD).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="pareto-ai-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp dist/bin/* "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cp packaging/arch/pareto-gateway.service \
             packaging/arch/pareto-gateway.sysusers \
             packaging/arch/pareto-gateway.conf "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -l "dist/$name.tar.gz"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "pareto-ai-$env:VERSION-${{ matrix.name }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/bin/*" $stage
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem "dist/$name.zip" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pareto-ai-${{ steps.version.outputs.version }}-${{ matrix.name }}
          if-no-files-found: error
          # Exactly one archive per platform; the expression avoids a warning
          # about the pattern that cannot match on this runner.
          path: ${{ runner.os == 'Windows' && 'dist/*.zip' || 'dist/*.tar.gz' }}
          # No retention override: same repository retention as the desktop
          # installers, so the server binaries do not expire earlier.

  # Lints the AUR recipes (missing depends, bad perms, wrong install paths) on
  # every run; the real build test happens on the first user's makepkg. PLACEHOLDER
  # sums are swapped for SKIP so namcap's checksum checks pass; CI injects the
  # real sums only when publishing.
  aur-lint:
    name: Lint PKGBUILDs with namcap
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git namcap

      - uses: actions/checkout@v4

      - name: Lint PKGBUILDs
        shell: bash
        run: |
          set -euo pipefail
          for pkg in packaging/arch/pareto-ai packaging/arch/pareto-ai-bin \
                     packaging/arch/pareto-ai-desktop packaging/arch/pareto-ai-desktop-bin; do
            cp "$pkg/PKGBUILD" /tmp/PKGBUILD
            sed -i "s/'PLACEHOLDER'/'SKIP'/" /tmp/PKGBUILD
            echo "::group::namcap $pkg"
            namcap /tmp/PKGBUILD
            echo "::endgroup::"
          done

  release:
    name: Attach gateway binaries to the GitHub Release
    # A release attaches only when the whole gate is green. The gateway job
    # alone is deliberately not gated on the UI tests, so the release has to
    # wait for web-check (and rust) explicitly.
    needs: [web-check, rust, gateway]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pareto-ai-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Updates the server AUR packages (pareto-ai, pareto-ai-bin) on every v*
  # tag. The desktop family is published by desktop.yml.
  publish-aur:
    name: Publish AUR packages (server)
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git openssh curl

      - uses: actions/checkout@v4

      # The AUR push uses an ed25519 key registered on the AUR account,
      # stored as the AUR_SSH_PRIVATE_KEY repo secret. AUR has no per-package
      # deploy keys, so that key is account-wide — treat it as a credential.
      - name: Publish pareto-ai (source) to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          export AUR_REPO=pareto-ai
          export PKGBUILD_PATH=packaging/arch/pareto-ai/PKGBUILD
          curl -fsSL "https://github.com/mohamadkhani/pareto-ai/archive/refs/tags/v${VERSION}.tar.gz" -o /tmp/tag-tarball.tar.gz
          export B2SUM="$(b2sum /tmp/tag-tarball.tar.gz | awk '{print $1}')"
          packaging/arch/publish-aur.sh

      - name: Publish pareto-ai-bin (prebuilt) to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          export AUR_REPO=pareto-ai-bin
          export PKGBUILD_PATH=packaging/arch/pareto-ai-bin/PKGBUILD
          TARBALL_URL="https://github.com/mohamadkhani/pareto-ai/releases/download/v${VERSION}/pareto-ai-${VERSION}-linux-x86_64.tar.gz"
          curl -fsSL "$TARBALL_URL" -o /tmp/release-tarball.tar.gz
          export B2SUM="$(b2sum /tmp/release-tarball.tar.gz | awk '{print $1}')"
          packaging/arch/publish-aur.sh
